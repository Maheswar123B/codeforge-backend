services:

  redpanda:
    image: redpandadata/redpanda:v25.2.1
    container_name: codeforge-redpanda

    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - "512M"
      - --reserve-memory
      - "0M"
      - --overprovisioned
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092

    ports:
      - "9092:9092"
      - "9644:9644"

    volumes:
      - redpanda-data:/var/lib/redpanda/data

    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redpanda-console:
    image: redpandadata/console:v3.2.2
    container_name: codeforge-redpanda-console

    depends_on:
      redpanda:
        condition: service_healthy

    environment:
      KAFKA_BROKERS: redpanda:29092

    ports:
      - "9081:8080"


  redis:
    image: redis:8.2.1
    container_name: codeforge-redis

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s


volumes:
  redpanda-data:
    name: codeforge-redpanda-data

  redis-data:
    name: codeforge-redis-data